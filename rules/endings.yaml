# 개조식 어미 변환 규칙 — 코드 수정 없이 여기만 고치면 됩니다.
#
# suffix_rules : 문장 끝이 왼쪽과 같으면 오른쪽으로 바꿉니다. 위에서부터 먼저 걸리는 규칙이 이깁니다.
#                (긴 것을 위에 두세요. "하였습니다"가 "습니다"보다 위에 있어야 합니다.)
# nominalize   : suffix_rules에 없으면, 이 어미들을 떼고 어간에 ㅁ/음을 붙입니다.
#                예) 진행하 → 진행함, 확인되 → 확인됨, 먹 → 먹음, 만들 → 만듦
# keep_as_is   : 이 말로 끝나면 건드리지 않습니다(고유명사·인용 등).

suffix_rules:
  # 존댓말 종결
  - ["하였습니다", "하였음"]
  - ["했습니다", "하였음"]
  - ["드렸습니다", "드렸음"]
  - ["입니다", "임"]
  - ["아닙니다", "아님"]
  - ["습니다", "음"]
  - ["합니다", "함"]
  - ["됩니다", "됨"]
  - ["봅니다", "봄"]
  - ["옵니다", "옴"]
  - ["갑니다", "감"]
  - ["바랍니다", "바람"]
  - ["드립니다", "드림"]
  - ["주십시오", "요청함"]
  - ["주시기 바랍니다", "요청함"]
  - ["해 주세요", "요청함"]
  - ["하세요", "요청함"]

  # 평서형 종결
  - ["하였다", "하였음"]
  - ["했다", "하였음"]
  - ["한다", "함"]
  - ["된다", "됨"]
  - ["되었다", "되었음"]
  - ["됐다", "되었음"]
  - ["이다", "임"]
  - ["있다", "있음"]
  - ["없다", "없음"]
  - ["같다", "같음"]
  - ["많다", "많음"]
  - ["적다", "적음"]
  - ["높다", "높음"]
  - ["낮다", "낮음"]
  - ["크다", "큼"]
  - ["작다", "작음"]
  - ["빠르다", "빠름"]
  - ["느리다", "느림"]
  - ["쉽다", "쉬움"]
  - ["어렵다", "어려움"]
  - ["좋다", "좋음"]
  - ["나쁘다", "나쁨"]
  - ["다르다", "다름"]
  - ["필요하다", "필요함"]
  - ["가능하다", "가능함"]
  - ["예정이다", "예정임"]
  - ["계획이다", "계획임"]
  - ["보인다", "보임"]
  - ["생각된다", "판단됨"]
  - ["판단된다", "판단됨"]
  - ["예상된다", "예상됨"]
  - ["요구된다", "요구됨"]
  - ["기대된다", "기대됨"]

nominalize:
  - "하였습니다"
  - "했습니다"
  - "였습니다"
  - "았습니다"
  - "었습니다"
  - "습니다"
  - "하였다"
  - "였다"
  - "았다"
  - "었다"
  - "한다"
  - "는다"
  - "ㄴ다"

keep_as_is:
  - "등"
  - "외"
  - "님"

# 문장 어디에나 적용되는 치환 (구어체·군더더기 정리)
replacements:
  - ["하고 있습니다", "하고 있음"]
  - ["하고 있음.", "중임."]
  - ["인 것 같습니다", "로 판단됨"]
  - ["인 것 같음", "로 판단됨"]
  - ["할 예정입니다", "할 예정임"]
  - ["감사합니다.", ""]
  - ["수고하셨습니다.", ""]
  - ["참고 부탁드립니다.", "참고 요망"]
  - ["확인 부탁드립니다.", "확인 요망"]
  - ["   ", " "]
  - ["  ", " "]

# 긴 문장을 끊을 수 있는 연결어미 (뒤에 쉼표가 오는 경우만 후보로 봄)
connectives:
  - "하고"
  - "하며"
  - "되며"
  - "이며"
  - "이고"
  - "지만"
  - "으나"
  - "라서"
  - "따라서"
