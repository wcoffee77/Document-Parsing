# 줄글 → 정식보고서 다듬기(draft)의 사실 검증 규칙 — 코드 수정 없이 여기만 고치면 됩니다.
#
# LLM이 다듬은 줄은 파이썬이 아래 규칙으로 원문과 대조한다. 걸린 줄은 한 번 고쳐 달라고 하고,
# 그래도 걸리면 그 줄을 원문 문장 그대로 바꾼다 — 어떤 경우에도 원문에 없는 사실이 보고서에 남지 않게.
# 근거: 정답 5건(docs/drafting-answers-analysis.md, 2026-10-03).

# 보고서에 써도 되는 한자 약어(정답 5건 + 사내 실측). 이 밖의 한자는 원문에 없으면 막는다.
allowed_hanja: "高低中現可必時順內人月年日前後外約無有要未對比增減新全各上下"

# 원문 표기 → 보고서 표기 (원문에 왼쪽 말이 있으면 오른쪽 말을 써도 된다)
terms:
  캘리브레이션: Calibration
  워크숍: 워크샵
  프로젝트: 과제

# 숫자로 바뀌어도 되는 우리말 (원문에 왼쪽 말이 있으면 오른쪽 숫자를 써도 된다)
number_words:
  하나: 1
  하루: 1
  한: 1
  첫째: 1
  첫: 1
  둘: 2
  두: 2
  둘째: 2
  세: 3
  셋: 3
  셋째: 3
  네: 4
  넷: 4
  넷째: 4
  다섯: 5
  여섯: 6
  일곱: 7
  여덟: 8
  아홉: 9
  열: 10

# 기간 말 — "8월 22일부터 이틀간"이면 23일도 원문에 있는 날짜로 본다
duration_days:
  이틀: 2
  사흘: 3
  나흘: 4
  닷새: 5

# 방향이 반대인 말 묶음. 다듬은 줄에 한쪽이 있는데 근거 원문에는 반대쪽만 있으면 막는다.
polarity:
  - name: 늘다↔줄다
    up: ["증가", "늘", "상승", "상향", "확대", "올라", "올랐", "올리", "올려", "오르", "높", "高", "↑", "증액", "인상"]
    down: ["감소", "줄", "하락", "하향", "축소", "내려", "내리", "낮", "低", "↓", "감액", "인하"]
  - name: 가능↔어려움
    up: ["가능", "可", "수 있"]
    down: ["불가", "어려", "어렵", "곤란", "난이도 高", "난항", "쉽지 않"]
  # 수량: "일부"를 "다수"로 바꾸면 왜곡(2026-10-05 실측 정답 5: "일부는 … 개인 부담" → "사례 다수")
  - name: 일부↔다수
    up: ["다수", "대다수", "대부분", "전원", "모두", "전부", "多"]
    down: ["일부", "소수", "몇몇", "일부만"]

# 확정·완료를 뜻하는 말. 다듬은 줄에 있으면 근거 원문에도 확정·완료 표현(아래 done_source)이 있어야 한다
# ("검토 중"을 "확정"으로 바꾸는 단정 수준 변경을 막는다).
done_words: ["확정", "완료", "결정", "마무리"]
done_source: ["확정", "완료", "결정", "마무리", "했", "됐", "되었", "하였", "끝"]
# 확정·완료 말 뒤에 이런 말이 오면 아직 확정이 아니다("결정 필요", "확정 예정")
done_pending: ["필요", "예정", "요", "검토", "추진", "전", "할", "하", "시"]

# 가능성("~할 수 있다")을 단정("~함")으로 바꾸는 것도 사실 왜곡이다(2026-10-05 실측: "달성이 어려워질 수 있어서" → "달성 어려움",
# "환율에 따라 달라질 수 있습니다" → "환율 변동에 따라 상이"). 근거 원문을 절(쉼표·~고·~며·~지만·~서)로 나눠 hedge_source가 든 절과
# 줄이 내용어(두 글자 이상 낱말의 앞 두 글자)를 hedge_overlap개 이상 나누는데 줄에 hedge_line이 하나도 없으면 막는다.
hedge_source: ["수 있", "우려", "가능성", "것으로 보", "듯"]
hedge_line: ["수 있", "우려", "가능성", "예상", "전망", "소지", "可", "가능", "약 ", "추정"]
hedge_overlap: 2
# "수 있" 바로 앞 서술어(어려워질·달라질·커질 …)를 줄이 옮겼는지 볼 때 같은 뜻으로 보는 말. 키는 서술어의 앞부분.
hedge_predicates:
  어려: ["어려", "곤란", "난항", "차질", "미달"]
  달라: ["달라", "상이", "변동", "차이"]
  커: ["커", "증가", "확대", "가중", "高"]
  늘: ["늘", "증가", "확대", "증원", "증액"]
  줄: ["줄", "감소", "축소"]
  생기: ["생기", "발생"]
  발생: ["발생"]
  지연: ["지연", "늦"]
hedge_stopwords: ["있습", "있어", "있는", "것으", "필요", "합니", "됩니", "보입", "때문", "정도", "경우", "이번", "현재"]

# 이 말은 원문에 없으면 쓰지 않는다 — 인사 문서에서 다른 뜻으로 읽힌다(2026-10-05 실측: "매년" → "연차" = 연차휴가로 읽힘).
blocked_terms: ["연차", "미채움"]   # 미채움: 쓰지 않는 말 — 공석이면 충분(2026-10-08 사용자)

# 숫자 뒤 범위 표현(이상·미만 등)은 사실의 일부다("3개월 넘게" → "3개월"은 왜곡). 원문에서 그 숫자 바로 뒤에 있었으면 줄에도 있어야 한다.
# "약·정도·가량"(어림)은 정답 보고서도 뺀 경우가 있어(정답 5: "연 4억 원 정도" → "4억원/년") 여기 넣지 않는다.
bound_source: ["이상", "이하", "미만", "초과", "넘"]
bound_line: ["이상", "이하", "미만", "초과", "넘", "↑", "+", "以上"]

# 원문이 대안을 비교하는지 알아보는 말(2026-10-07 실측 건2: '방안은 크게 두 가지', '첫째는', '둘째는'인데 결과가 표도 ①②도 아닌
# '- (1) …' 줄이었다). 걸리면 결과에 표나 ①② 줄이 있어야 한다 — 없으면 다시 쓰게 한다.
# 이것 하나만 걸려도 대안 비교 문서로 본다(2026-10-08 건5 '방안은 세 가지' — 다른 단서가 없어 번호 절 요구가 빠졌다)
alternative_strong_cues:
  - '(?:방안|방법|대안|안)[은는이가]?\s*(?:크게\s*)?(?:두|세|네)\s*가지'

alternative_cues:
  - '(?:방안|방법|대안|안)[은는이가]?\s*(?:크게\s*)?(?:두|세|네)\s*가지'
  - '첫째[는은,]'
  - '둘째[는은,]'
  - '[12１２]\s*안[은는]'
  - '[AB]\s*안[은는]'

# '진행 중' 표현 점검(2026-10-07 사용자 d2: 원문은 "법무 검토와 노조 협의를 거쳐"(앞으로의 계획)인데 보고서는 "(법무 검토 및 노조 협의 중)" —
# 아직 안 한 일을 하고 있는 일로 바꿈). 줄에 'OO 中/중'이 있는데 근거 원문에 그 낱말 뒤에 진행 표현이 없으면 막는다.
progress_line: ['中', '중']
progress_source: ['중', '하고 있', '하는 중', '진행하고', '진행 중', '검토하고', '협의하고', '운영하고', '있습니다']

# 검수에서 '빠진 절'로 치지 않는 군말 절(화자 표현·소개 문구). 이런 절을 보강하면 보고서에 쓸데없는 줄만 늘어난다.
audit_skip_clause:
  - '생각해 볼 수'
  - '(?:좋다고|좋겠다고|필요해 보|것 같)'
  - '(?:봅니다|보입니다|판단합니다|생각합니다)\s*$'
  - '(?:두|세|네)\s*가지(?:로|입니다|가 있)'
  - '^\s*(?:저는|일단|먼저)\s'

# '→'는 윗줄의 결과·목표에만 쓴다. 근거 원문이 이런 병렬 표현이면 '-'로 바꾼다(2026-10-08 사용자 건4:
# "업무 조정 요청 → 우수 과제 반영 검토"는 인과가 아니라 나란한 두 계획).
parallel_cues: ['(?<!과 )같이', '함께 검토', '아울러', '또한', '이와 별도로']
