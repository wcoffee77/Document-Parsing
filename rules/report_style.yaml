# 구어체·서술체 → 보고서(개조식) 문체 규칙 — 코드 수정 없이 여기만 고치면 됩니다.
#
# 근거: 사용자가 줄글 5건을 직접 고친 정답(samples/drafting/정답_N_*.txt, docs/drafting-answers-analysis.md).
#   정답 항목 56개(사람이 엔터로 나눈 둘째 줄은 윗줄에 합쳐 센다): 중앙값 23자, 75% 29자 이하, 90% 40자 이하, 최대 53자(공백 제외).
#   원문 문장 47개: 중앙값 42자, 최대 77자.
#   정답 줄의 끝은 명사·숫자·한자(高 中 順 …)이고 "~습니다/~다"로 끝난 줄은 0개.
# 쓰임: transform/report_style.py가 (1) LLM이 쓴 줄의 구어체를 점검(lint)해 다시 쓰게 하고,
#       (2) 점검에 걸린 줄을 사실은 건드리지 않고 규칙으로 고치며(fix), (3) LLM이 없거나 사실 검증에 실패했을 때의
#       대체 문장(원문 문장을 규칙으로만 개조식으로)을 만든다. 사실(숫자·날짜·방향)은 transform/factcheck.py가 따로 지킨다.

limits:
  line_chars: 45          # 한 항목의 공백 뺀 글자 수가 이보다 길면 길다(정답 항목의 93%가 이하) — 약한 점검
  connectives_max: 2      # 한 줄에 연결어미(~인데, ~했고, ~지만 …)가 이만큼 넘으면 문장이 늘어진 것

# 줄 끝이 이러면 서술체·구어체다(강한 점검: 반드시 고쳐야 한다). 정규식, 공백·마침표 앞에서 판정.
polite_endings: ["니다", "어요", "아요", "해요", "에요", "예요", "세요", "군요", "네요", "죠", "거든요", "는데요", "인데요"]
plain_ending: '[가-힣]다'   # ~다로 끝나는 서술체(한다, 했다, 있다 …)

# 화자·말투 표현(강한 점검). 보고서에는 쓰지 않는다.
speaker: ["저는", "제가", "저희", "우리가", "생각합니다", "생각됩니다", "보고드립니다", "제안드립니다", "건의드립니다",
          "것 같", "듯합니다", "싶습니다", "보입니다", "봅니다", "하려고 합니다", "할 계획입니다"]

# 문장 앞 군말·접속어 — 뜻이 없어 지워도 사실이 안 변한다(fix가 지움). "다만"은 단서를 알리는 말이라 지우지 않고 ※로 옮기게 한다.
leading_fillers: ["일단", "사실", "그리고", "그래서", "또한", "참고로", "한편", "아무래도", "그런데", "그러므로", "그러나"]

# 정도를 흐리는 구어 부사(약한 점검) — 사실의 정도를 바꿀 수 있어 지우지는 않는다. LLM이 수치·명사로 바꾸게 한다.
colloquial_adverbs: ["굉장히", "아주", "너무", "꽤", "정말", "엄청", "매우", "상당히", "좀", "조금", "거의"]

# 문장 중간의 구어 연결어미(약한 점검). 줄에 너무 많으면 문장이 늘어진 것.
connectives: ["는데", "인데", "했고", "하고", "했으며", "하며", "이며", "지만", "라서", "해서", "아서", "어서",
              "으니", "니까", "면서", "다가", "는데도", "기 때문에", "때문에", "것인데", "고 있는데"]

# 두 글자 항목명 가운데를 띄운다(정답 5건: 기 간, 대 상, 참 여, 일 정, 배 경). "공정 : …"처럼 분류 이름은 안 띄우므로 목록에 있는 말만.
spaced_labels: ["기간", "대상", "참여", "일정", "배경", "목적", "장소", "방법"]

# 표기 정리(fix) — 뜻은 그대로, 쓰는 모양만 정답 5건 쪽으로 맞춘다. [정규식, 바꿀 말]
notation:
  - ['(\d)\s*([조억만천])\s+원', '\1\2원']                       # 300만 원 → 300만원, 1억 2천만 원 → 1억 2천만원
  - ['(?<=[만억천])\s+원', '원']
  - ['(\d[\d,]*명)\s*중\s*(?=\d)', '\1 中 ']                      # 15명 중 12명 → 15명 中 12명
  - ['(\d[\d,]*건)\s*중\s*(?=\d)', '\1 中 ']
  - ['((?:협의|검토|진행|논의|준비|조율|확인|심사|선발))\s*중(?=[\s,)]|$)', '\1 中']   # 협의 중 → 협의 中
  - ['(\d)\s*퍼센트', '\1%']
  - ['\s+%', '%']
  - ['[ \t]{2,}', ' ']
  - ['\s+([,.)])', '\1']

# ㅂ불규칙 형용사는 어간에 "음"만 붙이면 틀린다(어렵음 → 어려움). 문장 끝에서만 고친다.
irregular_endings: [["어렵음", "어려움"], ["쉽음", "쉬움"], ["가깝음", "가까움"], ["무겁음", "무거움"], ["가볍음", "가벼움"],
                    ["덥음", "더움"], ["춥음", "추움"], ["아름답음", "아름다움"], ["어두웁음", "어두움"], ["고맙음", "고마움"]]

# 문장 끝에 붙은 군더더기를 뗀다(fix). 마침표는 쓰지 않는다.
strip_trailing: ['[.!?。]+$', '\s+$']

# 줄글 → 보고서 변환 예시(원문 문장 → 보고서 줄). 정답 5건에서 뽑았다. doc는 출처 정답 번호 —
# 채점할 때 그 문서의 예시를 빼서(tools/score_drafting.py --holdout) 베낀 것인지 가려낸다.
# kind: 변환 유형. LLM 지시문에 "문장 → 줄" 짝으로 넣는다.
examples:
  - {doc: 1, kind: "현황 나열 → 항목명 : 값",
     src: ["올해 R&D 경력 채용 계획 40명 중 27명이 입사를 확정했고 6명은 처우 협의 중이며 7명은 아직 후보를 찾는 중입니다."],
     out: ["채용 현황 : 입사 확정 27명, 처우 협의 中 6명, 후보 탐색 中 7명"]}
  - {doc: 1, kind: "분모·분자 → N명 中 M명",
     src: ["공정 엔지니어는 15명 계획에 12명을 채워서 거의 마무리되었고"],
     out: ["공정 : 15명 中 12명 확보"]}
  - {doc: 1, kind: "변화 → (기존 A → B)",
     src: ["헤드헌팅 수수료를 기존 25%에서 30%로 올려서 이번 주부터 재의뢰했고"],
     out: ["헤드헌팅 수수료 상향 추진 (기존 25% → 30%)", "*금주 의뢰 완료"]}
  - {doc: 1, kind: "변화 → (기존 A → B)",
     src: ["사내 추천 보상도 한시적으로 300만 원에서 500만 원으로 올리는 안을 검토하고 있습니다."],
     out: ["사내 추천 보상금 한시적 인상 검토 (기존 300만원 → 500만원)"]}
  - {doc: 1, kind: "목표·기한 → 한 줄",
     src: ["10월 15일까지 설계 직군 4명을 추가 확정하는 것이 목표입니다."],
     out: ["설계 인력 4명 추가 채용 목표(~10.15일)"]}
  - {doc: 1, kind: "원인·정도 → 한자 약어",
     src: ["아날로그 설계 경력자가 시장에 거의 없고 경쟁사 두 곳이 이달에 같은 직군을 대규모로 뽑기 시작해서 충원이 어렵습니다."],
     out: ["설계 직군 경우, 아날로그 설계 경력인력 부족 및 경쟁사(2개) 대규모 채용으로 충원 난이도 高"]}
  - {doc: 2, kind: "설문 결과 → 대상(규모), 결과 高",
     src: ["R&D 조직 설문에서 근무시간 경직성에 대한 불만이 높게 나왔습니다. 응답자는 312명입니다."],
     out: ["R&D 조직 구성원(312명) 대상 설문결과, 근무시간 경직성 관련 불만 高"]}
  - {doc: 2, kind: "비율 나열 → 항목(비율), 항목(비율)",
     src: ["58%가 출퇴근 시간 자율화를 가장 원하는 제도로 꼽았고, 재택근무 확대는 24%였습니다."],
     out: ["출퇴근 시간 자율화(58%), 재택근무 확대(24%) 등 희망"]}
  - {doc: 2, kind: "의견 → ※ 現",
     src: ["현재는 시차출퇴근제만 운영하고 있는데 출근 시각 선택 폭이 1시간뿐이라 체감 효과가 작다는 의견입니다."],
     out: ["※ 現 시차출퇴근제는 시간 선택 폭이 1시간으로 체감 효과 작다는 의견"]}
  - {doc: 2, kind: "요건 나열 → 요건 필요",
     src: ["근로기준법상 서면 합의가 필요하고 정산기간과 총 근로시간을 정해야 합니다."],
     out: ["근로기준법상 서면 합의 필요", "정산기간 및 총 근로시간 결정 필요"]}
  - {doc: 2, kind: "가능 → 可",
     src: ["노조 협의도 필요해서 빨라야 내년 2분기 시행이 가능합니다."],
     out: ["노조 협의 필요 (내년 2분기 시행 可)"]}
  - {doc: 3, kind: "기간 → 기 간 : 날짜(요일)",
     src: ["상반기 평가 캘리브레이션을 8월 22일부터 이틀간 진행했습니다."],
     out: ["기 간 : 8.22(토) ~23(일)"]}
  - {doc: 3, kind: "대상 → 규모 (범위)",
     src: ["대상은 연구개발 직군 대리급 이상 1,240명이고 각 팀장과 실장 38명이 참석했습니다."],
     out: ["대 상 : 총 1,240명 (연구개발 직군, 대리급 이상)", "참 여 : 보직장(실/팀장) 총 38명"]}
  - {doc: 3, kind: "분포 → 항목별, 기준은 * 보충",
     src: ["등급 분포는 S가 8%, A가 27%, B가 55%, C가 10%로 가이드라인인 S 10%, A 30%, B 50%, C 10%와 비교하면 S와 A는 조금 낮고 B가 높게 나왔습니다."],
     out: ["등급별 : S등급 8%, A등급 27%, B등급 55%, C등급 10%", "*평가 가이드(S등급 10%, A등급 30%, B등급 50%, C등급 10%)"]}
  - {doc: 3, kind: "최고·최저 → 順",
     src: ["설계 1실은 A 이상이 41%로 가장 높았고 공정 3실은 22%로 가장 낮았습니다."],
     out: ["부서별 : 설계 1실 A등급 41%, ∙∙∙, 공정 3실 A등급 22% 順"]}
  - {doc: 3, kind: "건수 → N건 中 M건",
     src: ["조정이 필요하다고 본 사례는 총 96건이었고 그중 71건을 실제로 조정했습니다."],
     out: ["조정건 : 검토 필요사례 총 96건 中 71건 조정"]}
  - {doc: 3, kind: "계획 → 명사 + (시기)",
     src: ["사전 평가자 교육을 9월 중에 실시하고 직무 난이도 가이드를 정비하는 것이 좋겠습니다."],
     out: ["직무 난이도 가이드 정비 및 사전 평가자 교육 실시(9월 중)"]}
  - {doc: 4, kind: "대상 + 늘림 → ※ 전년비",
     src: ["대상은 입사 10년차 이상 팀장 후보군 중 추천받은 30명이며 지난해보다 10명 늘렸습니다."],
     out: ["대 상 : 입사 10년차 이상 팀장 후보군 中 추천자 30명", "※ 전년비 10명 확대"]}
  - {doc: 4, kind: "프로그램 → 이름 : 방식 (횟수/人)",
     src: ["하나는 리더십 진단과 코칭인데 외부 전문기관에 의뢰해서 1인당 3회 1:1 코칭을 합니다."],
     out: ["리더십 진단/코칭 : 외부 전문기관 주관 일대일 코칭 (3회/人)"]}
  - {doc: 4, kind: "프로그램 → 이름 : 방식 (횟수/月)",
     src: ["다른 하나는 사업부장과의 멘토링으로 월 1회 총 3개월 진행합니다."],
     out: ["사업부장 멘토링 : 총 3개월간 진행 (1회/月)"]}
  - {doc: 4, kind: "예산 → 총액 (내역) + ※ 증가 이유",
     src: ["예산은 코칭 비용 4,500만 원과 워크숍 비용 1,200만 원을 합쳐 5,700만 원이고 작년 5,200만 원보다 늘었습니다. 증가분은 대상 인원 증가 때문입니다."],
     out: ["총 5,700만원 (코칭 비용 4,500만원, 워크샵 1,200만원)", "※ 참여자 확대로 전년 비용(5,200만원) 대비 상승"]}
  - {doc: 5, kind: "이유·결과 → ~하였고, ~응답",
     src: ["파견자 생활비 보조는 3년 전에 정한 기준표대로 지급하는데 그 사이 현지 주거비가 평균 22% 올랐고 파견자 18명 중 11명이 현지 주거비가 보조금을 초과한다고 응답했습니다."],
     out: ["최근 3년간 현지 주거비 평균 22% 상승하였고, 법인 파견자 총 18명 중 11명이 현지 주거비가 보조금 초과한다고 응답"]}
  - {doc: 5, kind: "대안 → ① 안 : 비용·난점",
     src: ["기준표를 지금 한 번 올리는 방법은 비용이 연 4억 원 정도 늘고"],
     out: ["① 회사 보조금 기준 상향 조정 : 4억원/년 추가비용 발생"]}
  - {doc: 5, kind: "대안 → ② 안 : 난점",
     src: ["매년 물가 연동으로 바꾸는 방법은 장기적으로 형평은 맞지만 연동 지표 선정이 어렵습니다."],
     out: ["② 연단위 보조금 책정(물가 연동) : 연동 지표 선정 어려움"]}
  - {doc: 5, kind: "제안 → 우선 ①, 내년부터 ②",
     src: ["저는 일단 이번 연말에 기준표를 한 번 올리고 내년부터 물가 연동 방식으로 전환하는 안을 제안드립니다."],
     out: ["우선 연말에 ① 회사 보조금 기준을 상향하고, 내년부터는 ② 물가 연동하여 보조금 책정하는 방식으로 전환 추진"]}
  - {doc: 5, kind: "경쟁사 일반화 → ※",
     src: ["A사는 매년 물가 연동으로 조정하고 B사는 주거비를 실비로 지원한다고 알려져 있습니다. 확인되지 않은 정보도 있습니다."],
     out: ["※ 경쟁사 경우, 매년 물가 연동하여 보조금 수준 조정하거나, 주거비를 실비로 지원 중 (단, 구체 지원방법 추가 확인 必)"]}
