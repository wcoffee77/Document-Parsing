[project]
name = "doc2report"
version = "1.0.0"
description = "Confluence/Markdown 문서를 사내 규격 보고서(.docx)로 변환"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.2",
    "lxml>=5.2.0",
    "fonttools>=4.53.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]

[project.scripts]
doc2report = "doc2report.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pdfplumber>=0.11.0",              # PDF로 뽑아 표 폭을 실측 검증할 때
    "pywin32>=306; sys_platform == 'win32'",  # Word로 실제 렌더 페이지 수 세기
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
