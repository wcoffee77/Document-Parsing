# 정식보고서 서식 — 상급 조직 보고용. default를 물려받고 아래 값만 바꾼다.
#
# 목적이 다른 두 서식이 있다 (2026-10-01 사용자):
#   - 정식보고서(이 파일): 상급 조직에 보고하는 문서. 사내 정식보고서 8건 실측(guide_mining probe)에 맞춘다.
#   - Confluence 변환(confluence.yaml): Confluence 문서를 A4로 인쇄해 편하게 읽기 위한 것. 이 파일과 무관.
#
# 정식보고서 실측과 사용자 설명으로 정한 것:
#   1) 단계는 들여쓰기 기능이 아니라 **앞 공백**으로 구분한다: 1.은 0칸, □는 1칸, -는 3칸.
#      말머리 뒤도 공백 한 칸(탭 아님). 그래서 indent·hanging은 0이다 — 둘째 줄은 왼쪽 여백에서 시작한다.
#      (2026-10-01 사용자 결정: probe 실측 중앙값 □ 1칸, - 3칸, ※ 4칸을 따른다. ·는 6칸 잠정.)
#   2) 표는 왼쪽 정렬, 머리행 음영 없음. 표 안 글자는 가운데 정렬 + 머리행 굵게(실측 70%·78%).
#   3) 주석은 "* 설명" — 바탕체 10pt 파란 글씨. 실제 문서는 텍스트 상자로 줄 아래에 띄우지만(B안) 여기서는
#      윗줄에 딸린 일반 문단으로 쓴다. 공백 4칸은 임시값(상자 위치 실측 전).
#   4) ※는 본문과 같은 크기(실측 14pt)이고 앞 공백 4칸.

extends: default
name: formal
description: 정식보고서 (상급 조직 보고용 — 공백으로 단계 구분, 왼쪽 정렬 표, 파란 주석)
label: 정식보고서
preset_order: 1

fonts:
  body:
    line_spacing: 143%       # 실측 1.429배 63%
  # 주석 "* …" — 바탕체 10pt 파란 글씨(실측: 크기 10pt 80%, 색 0000FF 53%·3333FF 21%, 줄간격 1.0 86%)
  annotation:
    size: 10pt
    color: "0000FF"
    line_spacing: 100%
    space_before: 0pt
    space_after: 0pt
    align: left

# 목록은 통째로 덮어써지므로 네 단계를 모두 적는다 (간격·굵기는 default와 같다).
numbering:
  # 간격 규칙(2026-10-01 사용자): 같은 단계가 이어지면 6pt(space_after), 더 얕은 단계로 올라가면(- 다음의 □ 등) 12pt,
  # 지면에 여유가 있으면 18pt(level_up), 내려갈 때(□ 다음의 -)는 6pt(level_change). ※·주석에도 똑같이 적용한다.
  # 앞 공백은 단계 번호를 따른다 — 1칸·3칸·5칸… (원문 말머리가 무엇이든 문서에 나온 순서가 단계를 정한다: levels_by_order)
  - marker: "{n}."
    indent: 0mm
    hanging: 0mm
    lead_spaces: 0
    marker_sep: " "
    bold: true
    space_before: 0pt        # 새 절 앞 간격은 단락 앞이 아니라 윗줄 뒤(text.gap_after_section)로
    space_after: 6pt
    space_after_level_change: 6pt
    space_after_level_up: 12pt
    space_after_level_up_max: 18pt

  - marker: "□"
    ordered_marker: "□"
    aliases: ["■", "◻", "ㅁ"]
    indent: 0mm
    hanging: 0mm
    lead_spaces: 1
    marker_sep: " "
    bold: true
    space_before: 0pt
    space_after: 6pt
    space_after_level_change: 6pt
    space_after_level_up: 12pt
    space_after_level_up_max: 18pt

  - marker: "-"
    ordered_marker: "-"
    aliases: ["–", "—"]
    indent: 0mm
    hanging: 0mm
    lead_spaces: 3
    marker_sep: " "
    space_after: 6pt
    space_after_level_change: 6pt
    space_after_level_up: 12pt
    space_after_level_up_max: 18pt

  - marker: "·"
    ordered_marker: "·"
    aliases: ["ㆍ", "ᆞ", "‧", "∙", "•", "."]
    indent: 0mm
    hanging: 0mm
    lead_spaces: 5
    marker_sep: " "
    space_after: 6pt
    space_after_level_change: 6pt
    space_after_level_up: 12pt
    space_after_level_up_max: 18pt

  - marker: "·"               # 다섯째 단계 — 1. □ (1) - · 처럼 단계가 하나 더 낀 문서(말머리는 원문 그대로)
    indent: 0mm
    hanging: 0mm
    lead_spaces: 7
    marker_sep: " "
    space_after: 6pt
    space_after_level_change: 6pt
    space_after_level_up: 12pt
    space_after_level_up_max: 18pt

tables:
  align: right               # 표 오른쪽 끝을 여백선에 두고 폭 = 윗줄 글자 시작 ~ 오른쪽 여백이라 왼쪽 끝이 윗줄에 맞는다(left+들여쓰기는 Word에서 어긋남, 2026-10-01 사용자)
  note_space_before: 6pt     # 표 바로 아래 ※ 부연 설명은 표에 딸린 줄 — 앞 간격 18pt가 아니라 6pt (2026-10-01 사용자)
  equal_columns: true        # 같은 성격(값)의 열은 폭을 같게 (2026-10-01 사용자)
  note_columns: ["비고", "이슈", "참고", "특이사항", "의견", "코멘트"]   # 참고 열 — 핵심 데이터가 아니라 비중을 작게
  note_column_size: 10pt     # 참고 열 글자 크기
  note_column_scales: [100%, 90%]   # 폭 상한을 넘으면 장평 90%까지
  note_column_max: 30%       # 참고 열이 표 폭에서 차지하는 최대 비율
  note_markers: ["주)", "주:"]   # 표 아래 "*"는 표 주석이 아니라 본문 주석(파란 10pt)이고, ※는 본문 ※ 줄이다
  header_rule_width: 1.5pt   # 음영 대신 머리행 아래 테두리를 1.5pt로 (2026-10-01 사용자)
  header_shading: null       # 정식보고서 표는 음영 없음 (실측: 직접 음영 0건)

text:
  polish: none               # 정식보고서는 문구를 고치지 않는다 — 개조식·문장 분리는 줄바꿈이 낀 문장을 쪼개 ","를 "."로 바꾸고
                             # 이어진 줄을 새 항목으로 만든다(2026-10-01 사용자). 초안을 개조식으로 바꾸려면 --polish rules
  merge_short_items: false   # 정식보고서는 문구를 안 고친다 — "및" 병합도 문장을 바꾸는 일이라 끈다(polish: none이어도 이 병합은 따로 돌아서 샘플에서 두 항목이 합쳐졌다)
  note_size_delta: 2pt       # ※는 주 문장이 아니라 본문보다 2pt 작게 (14pt → 12pt, 2026-10-01 사용자)
  note_indent: 0mm           # ※ 들여쓰기는 공백으로 (note_lead_spaces)
  note_lead_spaces: 4
  annotation_markers: ["*", "＊", "∗", "(주석)"]   # 전각 별표나 "(주석) 설명"으로 쳐도 "* 설명"으로 통일해 파란 10pt로 쓴다
  annotation_mark: "*"
  annotation_lead_spaces: 4
  level_bold_original: true  # 서식을 다 없앤 글(txt)도 1.·□ 문장은 굵게 (실측: □ 전부 굵게 39%·앞부분 36%)
  # 줄 맞춤 — 정식보고서는 줄이 길면 엔터로 나누고 왼쪽 끝을 윗줄 글자에 맞추며, 아슬아슬하게 넘치면
  # 글자 간격을 0.1~0.5pt 좁혀 줄 바뀜을 막는다(2026-10-01 사용자 — "아주 많음").
  fit_lines: true
  condense_max: 1pt          # 글자 간격을 좁히는 최대치 (2026-10-01 사용자: 1pt까지)
  condense_step: 0.1pt
  fit_margin: 0.2%           # 글꼴 폭 계산 오차 대비 여유. 크면 원본처럼 꽉 채운 줄이 나뉘어 버린다(1pt 한도의 8%를 0.5%가 먹음)
  fit_bold_factor: 100%      # 굵은 글자 폭 = 보통 글자 폭 × 이 값. 잠정(굵은 □ 줄이 두세 글자 남기고 일찍 나뉨) — probe 실측으로 확정
  condense_pad: 0.4pt        # 계산상 0.6~0.9pt면 되는 줄을 Word는 1.0pt여야 한 줄에 넣었다(2026-10-01 두 번 실측) — 계산값 + 0.4pt, 최대 condense_max
  shorten_to_fit: true       # 좁히기 한도까지 써도 두세 글자가 넘치면 LLM이 표현을 줄여 한 줄로(LLM을 켰을 때만)
  # gap_after_annotation·gap_after_note는 정하지 않는다 — 주석·※ 뒤도 일반 항목과 같은 규칙(같은 단계 6pt, 올라가면 12·18pt)
  levels_by_order: true      # 말머리 단계는 문서에 나온 순서로(1. □ - / 1. □ (1)·① - / □ - / (1) □ - …), 한 단계씩 내려간다 (2026-10-01 사용자)
  pattern_depths:            # 종류 구분용: (1)과 ①은 같은 종류
    - {pattern: '^(?:\(\d{1,2}\)|[①-⑳])', depth: 1}
  gap_after_section: 18pt    # 마지막 하위 항목 뒤 — 새 절(3.) 앞 간격
  annotation_box_height: 5mm  # 주석 상자는 한 줄에 5mm (2026-10-01 사용자 — 글자 높이에 딱 맞으면 겹쳐 보임)
  annotation_box: true       # 주석은 텍스트 상자(원본과 같음). 못 만들면 일반 문단 주석으로
