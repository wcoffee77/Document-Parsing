# Confluence·내용 많은 문서용 서식 — default를 물려받고 아래 값만 바꾼다.
#
# Confluence URL을 변환하면 -p 없이도 이 프로파일이 자동으로 쓰인다.
# 마크다운이라도 글이 많은 문서면 -p confluence 로 고를 수 있다.
#
# 2026-09-29 사용자 규칙:
#   1) 원문에 이미 쓴 글머리 기호(1. 1) □ - · ① ※ 등)는 바꾸지 않는다 — default에서 물려받음
#   2) Confluence 문장은 이미 정리돼 있으니 문장을 따로 다듬지 않는다 — text.polish: none
#   3) 내용 많은 문서는 제목 16pt, 본문 12pt, 표 11~9pt
# 2026-09-29 사용자 "Confluence 변환" 서식(두 번째 확정):
#   여백 위·아래·좌·우 모두 2cm, 맑은 고딕, 제목 18pt 가운데·밑줄,
#   본문 12pt·장평 95%·줄간격 1.0배·단락 앞뒤 간격 0pt,
#   표 10pt·장평 80% 고정(글씨가 많아도 9pt로 줄이지 않음)

extends: default
name: confluence
description: Confluence·내용 많은 문서 (원문 말머리·문장 유지)
label: Confluence 출력
preset_order: 2

page:
  margin:
    top: 20mm
    bottom: 20mm
    left: 20mm
    right: 20mm

fonts:
  body:                      # 다른 서식(제목·표·날짜)은 글꼴을 body에서 물려받는다
    eastAsia: 맑은 고딕
    ascii: 맑은 고딕
    size: 12pt
    line_spacing: 100%
    char_scale: 95%          # 장평 — 말머리 항목·일반 문단
    space_before: 0pt
    space_after: 0pt
  title:
    size: 18pt
    align: center
    underline: true
    char_scale: 100%         # 본문 장평을 물려받지 않게
  date:
    size: 12pt
    char_scale: 100%
  table:
    size: 10pt
  caption:
    size: 12pt
    char_scale: 100%
  callout:                   # Confluence 정보·경고 패널 — 본문과 같은 크기
    size: 12pt

# 들여쓰기는 단락 기능(cm)이 아니라 공백으로 — 상위 단계보다 하위 단계가 두 칸 안쪽 (2026-10-09 사용자:
# □ → - → · 로 내려갈 때마다 스페이스 두 칸). 말머리 뒤는 공백 한 칸. 단계는 원문 말머리가 정한다(aliases) —
# 가장 바깥 단계가 0칸(text.normalize_levels). 목록은 통째로 덮어써지므로 다섯 단계를 모두 적는다.
numbering:
  - marker: "{n}."
    indent: 0mm
    hanging: 0mm
    lead_spaces: 0
    marker_sep: " "
  - marker: "□"
    ordered_marker: "□"
    aliases: ["■", "◻", "ㅁ"]
    indent: 0mm
    hanging: 0mm
    lead_spaces: 2
    marker_sep: " "
  - marker: "-"
    ordered_marker: "-"
    aliases: ["–", "—"]
    indent: 0mm
    hanging: 0mm
    lead_spaces: 4
    marker_sep: " "
  - marker: "·"
    ordered_marker: "·"
    aliases: ["ㆍ", "ᆞ", "‧", "∙", "•", "."]
    indent: 0mm
    hanging: 0mm
    lead_spaces: 6
    marker_sep: " "
  - marker: "·"
    indent: 0mm
    hanging: 0mm
    lead_spaces: 8
    marker_sep: " "

# 단락 앞뒤 간격 0pt — 1.·□·- 모든 단계에 똑같이(단계가 바뀌는 자리 간격도 0)
numbering_all:
  space_before: 0pt
  space_after: 0pt
  space_after_level_change: 0pt

tables:
  keep_on_page: true         # 표는 쪽 사이에서 잘리지 않게 — 정식보고서와 같음 (2026-10-09 사용자)
  page_fit_min_scale: 0.9
  page_fit_margin: 6mm
  page_fill_target: 80%      # 표가 든 쪽이 80%보다 비면 표 행 높이를 늘려 채움 (2026-10-09 사용자)
  row_stretch_max: 15mm      # 한 행에 더할 수 있는 높이의 상한 — 표가 어색하게 늘어지지 않게
  font_ladder: [10pt]        # 10pt 고정 — 글씨가 많아도 더 줄이지 않는다(사용자)
  char_scale_ladder: [80%]   # 장평 80% 고정

text:
  hang_after_marker: true    # 줄바꿈된 글을 말머리 뒤 글자에 맞춤 (단계 들여쓰기는 앞 공백)
  keep_blank_lines: true     # 원문의 빈 줄(엔터로 띄운 문단 사이)을 한 줄로 살림 (2026-10-09 사용자)
  note_indent: 0mm           # ※는 윗줄보다 0.4cm가 아니라 공백 두 칸 안쪽
  note_extra_spaces: 2
  polish: none               # 문장 다듬기(개조식·명사 종결·LLM) 안 함. --polish를 주면 그쪽이 이긴다
  gaechosik: false
  noun_ending: false
  split_long_sentences: false
  merge_short_items: false   # "및" 병합도 문장을 바꾸는 일이라 끈다
  auto_markers: false        # 말머리 없는 제목·문단에 □/- 를 새로 만들지 않음(이미 구분해 쓴 문서)
  level_bold: false          # 1.·□ 단계 문장 전체 굵게 안 함 — 원문에서 굵던 글씨와 제목만 굵게

choices:
  font: [맑은 고딕, 바탕체]
  line_spacing: ["1.0", "1.15", "1.25", "1.45"]
  title_size: [18pt, 16pt, 20pt]
  size: [12pt, 11pt, 13pt]
  table_size: [10pt, 11pt, 9pt]
  body_scale: ["95%", "100%", "90%"]
  table_scale: ["80%", "90%", "95%", "100%"]
