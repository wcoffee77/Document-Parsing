# 사내 보고서 기본 서식
#
# 값을 고치면 코드 수정 없이 바로 반영됩니다. 단위는 붙여 씁니다("14pt", "25mm", "145%").
# 변환할 때 일부만 바꾸고 싶으면 프로파일을 고치는 대신 CLI 옵션을 쓰세요.
#   doc2report convert 문서.md -o out.docx --ask
#   doc2report convert 문서.md -o out.docx --font "맑은 고딕" --size 12pt --line-spacing 1.5

name: default
description: 사내 보고서 표준 서식 (A4 세로, 바탕체 14pt)

page:
  size: A4
  orientation: portrait
  margin:
    top: 25mm
    bottom: 25mm
    left: 20mm
    right: 20mm
    header: 12mm
    footer: 10mm

fonts:
  # body 는 모든 서식의 상속 기준이라 eastAsia / ascii / size 가 반드시 필요합니다.
  body:
    eastAsia: 바탕체
    ascii: 바탕체
    size: 14pt
    color: "000000"
    line_spacing: 145%     # 배수 1.4~1.5
    space_before: 0pt
    space_after: 0pt
    align: both

  # 제목 — 최상단 가운데, 굵게, 밑줄
  title:
    size: 20pt
    bold: true
    underline: true
    align: center
    space_before: 0pt
    space_after: 10pt
    line_spacing: 130%

  # 날짜 — 제목 바로 아래, 오른쪽 정렬 (문서 첫 줄이 "2026. 10. 1" 형태면 자동 인식)
  date:
    size: 14pt
    align: right
    space_before: 0pt
    space_after: 9pt        # 6~12pt 범위
    line_spacing: 130%

  # 마크다운의 ##, ### 은 별도 제목 스타일 없이 본문 단계로 흡수되지만,
  # 필요하면 아래 값을 살려 쓰면 됩니다.
  heading1:
    size: 15pt
    bold: true
    space_before: 12pt
    space_after: 6pt
    align: left
    keep_next: true

  heading2:
    size: 14pt
    bold: true
    space_before: 9pt
    space_after: 6pt
    align: left
    keep_next: true

  heading3:
    size: 14pt
    bold: true
    space_before: 6pt
    space_after: 3pt
    align: left
    keep_next: true

  table:
    size: 12pt
    line_spacing: 100%      # 셀 안은 1배수
    space_before: 0pt
    space_after: 0pt
    align: center           # 셀 내용 가운데 정렬

  table_header:
    inherit: table          # 크기·줄간격은 table에서 물려받고 아래 것만 덮어씀
    bold: true
    align: center

  caption:
    size: 12pt
    bold: true
    align: center
    space_before: 3pt
    space_after: 3pt

  code:
    eastAsia: D2Coding
    ascii: Consolas
    size: 11pt
    line_spacing: 115%
    align: left
    space_before: 3pt
    space_after: 3pt

  callout:
    size: 14pt
    indent: 5mm
    align: left

# 단락 체계: 1. → □(한 칸 들여쓰기) → -(세 칸 들여쓰기)
#   indent  : 왼쪽 들여쓰기 (14pt 한 글자 ≈ 5mm 기준)
#   hanging : 말머리 뒤 본문이 걸리는 위치 (둘째 줄부터 정렬됨)
#   bold    : 그 단계 문장 전체를 굵게
#   space_after_level_change     : 다음 항목의 단계가 바뀔 때 주는 간격 (기본값)
#   space_after_level_change_max : 지면에 여유가 있으면 여기까지 늘린다
#   space_before : 하위 단계가 끝나고 이 단계가 다시 시작될 때 앞에 주는 간격
#                  (- 로 끝난 뒤 2. 가 시작되는 자리를 확실히 끊어 준다)
numbering:
  - marker: "{n}."
    indent: 0mm
    hanging: 7mm
    bold: true
    space_before: 14pt
    space_after: 0pt
    space_after_level_change: 6pt
    space_after_level_change_max: 12pt

  - marker: "□"
    ordered_marker: "□"
    indent: 5mm
    hanging: 6mm
    bold: true
    space_before: 3pt
    space_after: 0pt
    space_after_level_change: 6pt
    space_after_level_change_max: 12pt

  - marker: "-"
    ordered_marker: "-"
    indent: 15mm
    hanging: 5mm
    space_after: 0pt
    space_after_level_change: 6pt
    space_after_level_change_max: 12pt

  - marker: "·"
    ordered_marker: "·"
    indent: 20mm
    hanging: 5mm
    space_after: 0pt
    space_after_level_change: 6pt
    space_after_level_change_max: 12pt

tables:
  header_shading: "D9D9D9"
  border_width: 0.5pt
  border_color: "000000"
  cell_margin_x: 1.4mm      # 셀 좌우 안쪽 여백
  cell_margin_x_min: 0.6mm  # 폭이 모자랄 때 여기까지 줄임
  cell_margin_y: 0.4mm
  font_ladder: [12pt, 11pt, 10pt, 9pt, 8pt]  # 위에서부터 시도, 마지막이 하한
  max_cell_lines: 4         # 한 셀이 이보다 많이 줄바꿈되면 글자 크기를 한 단계 낮춤
  safety_margin: 3%         # 폰트 메트릭 오차 대비 여유
  repeat_header: true       # 표가 페이지를 넘으면 머리행 반복
  keep_row_together: true   # 행 중간 잘림 방지
  allow_landscape: false    # 그래도 안 들어가면 가로 페이지로 전환할지
  align: center
  valign: center
  width_ratio: 1.0
  space_after: 18pt         # 표 바로 다음 문단이 표에 붙지 않도록 확보하는 앞 간격
  row_height: 7mm           # 행 최소 높이 (내용이 많으면 알아서 더 늘어남)
  row_height_relaxed: 10mm  # 지면에 여유가 있을 때의 행 최소 높이

text:
  gaechosik: true           # 개조식(명사형 종결) 변환
  split_long_sentences: true
  max_sentence_chars: 60
  rules: [endings, notation]
  keep_original_in_tables: true
  date_format: "{y}. {m}. {d}"   # 2026. 10. 1
  headings_as_levels: true       # ##/### 제목도 1./□ 체계로 흡수
                                 # (제목 스타일을 따로 쓰려면 false)

# --ask 로 변환 전에 물어볼 때 보여 줄 선택지 (직접 입력도 가능)
choices:
  font: [바탕체, 맑은 고딕]
  size: [14pt, 13pt, 12pt, 11pt]
  line_spacing: ["1.4", "1.45", "1.5", "1.6"]
  table_size: [12pt, 11pt, 10pt, 9pt]
